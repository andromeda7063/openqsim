[tool.uv.workspace]
members = ["libqsim", "qsim-gui"]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["libqsim/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
mypy_path = "libqsim/src"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "libqsim.*"
strict = true
