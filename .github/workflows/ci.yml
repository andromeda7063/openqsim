name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Ruff linter check
        run: uv run ruff check .

      - name: Ruff formatter check
        run: uv run ruff format --check .

      - name: Mypy typecheck
        run: uv run mypy libqsim

      - name: Run boundary tests
        run: uv run pytest libqsim/tests

      - name: Run Qiskit conventions spike
        run: uv run python spikes/qiskit_conventions.py

      - name: Run PySide6 window spike (offscreen)
        run: QT_QPA_PLATFORM=offscreen uv run python spikes/pyside_window.py
